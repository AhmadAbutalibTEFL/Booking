.brand-icon{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.22);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:16px}
.bar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar button{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:20px;padding:7px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.bar button:hover{background:rgba(255,255,255,.32)}
.hero h1{max-width:760px;margin:0 auto;font-size:26px}
.hero p{max-width:760px;margin:6px auto 0;opacity:.92;line-height:1.5}
main{max-width:760px;width:100%;margin:-34px auto 32px;padding:0 14px;flex:1}
main.wide{max-width:1120px}

.card h3{margin:0 0 8px;font-size:15px}

input[type=checkbox]{width:auto;margin:0}
input.t{width:auto;margin:0;padding:8px}
textarea{min-height:80px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

a.btn{display:block;text-align:center;text-decoration:none;margin-top:10px}
.mut{color:var(--mut);font-size:14px;line-height:1.5}

.okb{background:#e3f8ef;color:#0b6b47;padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:14px}
.ok{text-align:center}.ok .big{font-size:44px}
.bk{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.bk:first-of-type{border-top:0;padding-top:0}
.bk a{color:var(--pri);font-size:14px}
.tc{display:flex;gap:14px;align-items:center}
.tc h2{margin:0 0 4px;font-size:19px}.tc p{margin:0}
.av{flex:none;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#5b5bf0,#2fc4b2);color:#fff;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.fl{font-size:13px;color:var(--mut);margin:0 0 4px;display:block}
.day{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.day:first-of-type{border-top:0}
.day b{width:90px;flex:none;padding-top:8px}
.day .rs{display:flex;flex-direction:column;gap:8px;flex:1}
.lk{display:flex;gap:8px;align-items:stretch}.lk input{margin:0;direction:ltr}
.ck{display:flex;gap:8px;padding:6px 0;font-size:15px;align-items:center}
.ck a{color:var(--pri);cursor:pointer;text-decoration:underline}
.sub{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.feat{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg)}
.feat b{display:block;margin-bottom:4px;font-size:15px}
.calwrap{overflow-x:auto;padding-bottom:8px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(148px,1fr));gap:8px;min-width:1040px}

.calday.single{min-height:auto}
.calday h3{font-size:14px;margin:0 0 8px}
.calfree{font-size:12px;color:#087b5b;background:#dff7ed;border-radius:8px;padding:8px;margin:6px 0}
.calbook{font-size:12px;background:#e7e8ff;border-inline-start:4px solid var(--pri);border-radius:8px;padding:8px;margin:6px 0;color:#1d2340}
.calbook small{display:block;color:#4a5072;margin-top:3px}
.calempty{font-size:12px;color:var(--mut);padding:8px 0}
.calnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(91,91,240,.14);color:var(--pri);margin-inline-start:6px}

.tt2 .tt2-b small{font-size:10px;opacity:.9}
.tt2 .tt2-x{background:rgba(239,68,68,.12);border:1px dashed #ef4444;cursor:default;opacity:.85}

// '+1' (US/Canada/Caribbean) and '+7' (Russia/Kazakhstan) are shared codes: shown as a neutral globe, never guessed.
function parsePhone(raw){
  let p=String(raw||'').trim().replace(/[\s().-]/g,'');
  if(!p) return {empty:true};
  if(p.startsWith('00')) p='+'+p.slice(2);
  if(!/^\+\d{7,15}$/.test(p)) return {invalid:true,hasPlus:p.startsWith('+')};
  const d=p.slice(1);
  if(d[0]==='1'||d[0]==='7') return {shared:true,code:d[0]};
  for(const n of [3,2]){const iso=CALLING[d.slice(0,n)]; if(iso) return {iso,flag:String.fromCodePoint(...[...iso].map(c=>0x1F1E6+c.charCodeAt(0)-65))};}
  return {unknown:true};
}
function phoneWithFlag(phone){
  const r=parsePhone(phone), t=String(phone||'').trim();
  if(r.empty) return '—';
  if(r.flag) return r.flag+' '+t;
  if(r.invalid) return '⚠️ '+t;
  return '🌐 '+t;
}

  const id=S.me.teacher.id, today=new Date().toISOString().slice(0,10), now=new Date().toISOString();
  const bq = cols => sb.from('bookings').select(cols).eq('teacher_id',id).eq('status','confirmed').gte('starts_at',now).order('starts_at');
  try{await sb.rpc('maintain_my_recurring_bookings')}catch(e){console.warn('Recurring schedule refresh failed',e)}
  const [a,b,c,d] = await Promise.all([
    sb.from('session_types').select('*').eq('teacher_id',id).order('duration_min'),
    sb.from('availability_rules').select('*').eq('teacher_id',id).order('start_time'),
    sb.from('availability_exceptions').select('*').eq('teacher_id',id).gte('on_date',today).order('on_date'),
    bq('id,student_name,contact_phone,notes,starts_at,ends_at,blocked_until,series_id,session_type_id,booker_id,session_types(name,name_ar,duration_min),profiles:profiles!bookings_booker_id_fkey(full_name,email)')]);
  S.dTypes=a.data||[]; S.dRules=b.data||[]; S.dExc=c.data||[];
  S.wk={}; for(let i=0;i<7;i++) S.wk[i]=[];
  S.dRules.forEach(r=>S.wk[r.weekday].push([r.start_time.slice(0,5),r.end_time.slice(0,5)]));
  let bk=d;
  if(bk.error) bk=await bq('id,student_name,starts_at,ends_at,blocked_until,series_id,session_type_id,booker_id,session_types(name,name_ar,duration_min),profiles:profiles!bookings_booker_id_fkey(full_name,email)');
  S.dBk=bk.data||[];
  try {
    const ids=S.dBk.map(x=>x.id);
    if(ids.length){
      const [who,ov]=await Promise.all([
        sb.rpc('get_teacher_booking_bookers',{p_booking_ids:ids}),
        sb.rpc('get_booking_slot_overrides',{p_teacher:id,p_from:new Date().toISOString(),p_to:new Date(Date.now()+60*864e5).toISOString()})
      ]);
      if(!who.error){
        const map=new Map((who.data||[]).map(x=>[x.booking_id,x]));
        S.dBk.forEach(x=>{const v=map.get(x.id);if(v)x.profiles={full_name:v.full_name,email:v.email};});
      }
      S.slotOverrides={};
      (ov.data||[]).forEach(x=>S.slotOverrides[new Date(x.slot_start).toISOString()]=x.action);
    }
  } catch(e){ console.warn('Booking attribution/slot overrides unavailable',e); }
}
async function loadTeacher(){

  if(!S.slug) return;
  const r = await sb.from('teachers').select(TCOLS).eq('slug',S.slug).maybeSingle();

async function loadBook(keep){
  if(!S.user||!S.t) return;
  const id=S.t.id, ty=keep&&S.ty&&S.ty.id, err=keep?S.err:'';
  S.ty=null;S.day=null;S.slot=null;S.slots={};S.done=null;S.err=err;
  const [a,b,c,r] = await Promise.all([
    sb.from('session_types').select('*').eq('teacher_id',id).eq('is_active',true).order('duration_min'),
    sb.from('availability_rules').select('*').eq('teacher_id',id),
    sb.from('availability_exceptions').select('*').eq('teacher_id',id),
    sb.rpc('get_busy_times',{p_teacher:id,p_from:new Date().toISOString(),p_to:new Date(Date.now()+85*864e5).toISOString()})]);
  S.types=a.data||[]; S.rules=b.data||[]; S.exc=c.data||[];
  S.busy=(r.data||[]).map(x=>[Date.parse(x.starts_at),Date.parse(x.blocked_until)]);
  S.ty=(ty&&S.types.find(x=>x.id===ty)) || (S.types.length===1?S.types[0]:null);
  await build(); S.loaded=id;
}
async function build(){
  S.slots={}; S.slotState={}; S.day=null; S.slot=null; if(!S.t||!S.ty) return;
  const {data,error}=await sb.rpc('get_available_slots',{p_teacher:S.t.id,p_session_type:S.ty.id,p_from:null,p_days:S.rs?28:14});
  if(error){console.warn('get_available_slots failed',error); S.err=tr('m_ttLoadErr'); return}
  (data||[]).forEach(r=>{
    if(r.state==='closed') return;
    const ms=Date.parse(r.slot_start), k=new Date(ms).toLocaleDateString('en-CA');
    (S.slots[k]=S.slots[k]||[]).push(ms); S.slotState[ms]=r.state;
  });
  Object.values(S.slots).forEach(a=>a.sort((x,y)=>x-y));
}

async function contactFor(id){
  const c = await sb.rpc('get_booking_contact',{p_booking:id});
  return (c.data && c.data[0]) || {};
}
function bookErr(msg){
  const m=(msg||'').toLowerCase();
  return tr(m.includes('booking limit')?'limit':m.includes('too soon')?'tooSoon':m.includes('slot closed')?'m_closedErr':m.includes('outside availability')?'m_availErr':m.includes('invalid phone')?'m_phoneErr':m.includes('name')?'needName':'taken');
}

  const b=[...S.dBk].reverse().find(x=>x.student_name===el.value&&x.contact_phone), p=$('#ph');

async function book(){
  if(S.booking) return;
  const n=$('#sn').value.trim(); if(!n){S.err=tr('needName');render();return}
  const ph=$('#ph').value.trim();
  if(ph&&parsePhone(ph).invalid){S.err=tr('m_phoneErr');render();return}
  const fixed=!!$('#recurringFixed')?.checked;
  let cnt=null, mode='weekly';
  if(fixed){cnt=parseInt($('#recurrenceCount')?.value||'',10); if(!(cnt>=1&&cnt<=52)){S.err=tr('m_countErr');render();return} mode=cnt===1?'once':'fixed';}
  S.booking=true;
  const submit=$('#app .card:last-child .btn');
  if(submit){submit.disabled=true;submit.textContent=lang==='ar'?'جارٍ تأكيد الحجز…':'Booking…';}
  try{
    const {data,error}=await sb.rpc('book_lesson',{p_teacher:S.t.id,p_session_type:S.ty.id,p_starts:new Date(S.slot).toISOString(),p_student:n,p_phone:ph,p_notes:'',p_mode:mode,p_count:cnt});
    if(error){S.booking=false; S.err=''; await loadBook(true); S.err=bookErr(error.message); render(); return;}
    const skipped=(data&&data.skipped)||[], bid=data&&data.booking_id;
    const createdForTeacher=!!S.teacherBooking;
    S.err=''; S.booking=false;
    if(createdForTeacher){
      S.teacherBooking=false; S.rsAsTeacher=false; S.slug=null; S.done=null;
      await loadDash(); S.tab='calendar';
      S.msg=(lang==='ar'?'تم حجز الحصة للطالب بنجاح.':'Lesson booked for the student.')+(skipped.length?' '+tr('m_skipped')+': '+skipped.length:''); render(); return;
    }
    S.done={start:S.slot,name:n,type:S.ty,t:S.t,meeting:'',whatsapp:'',recurring:mode!=='once',skipped}; render();
    try{
      const ct=await contactFor(bid);
      S.done.meeting=ct.meeting_url||''; S.done.whatsapp=ct.whatsapp||'';
      await loadMine();
      if(S.me?.teacher) await loadDash();
    }catch(refreshError){console.warn('Booking succeeded; optional post-booking refresh failed:',refreshError);}
    render();
  }catch(requestError){
    console.error('Booking request failed:',requestError);
    S.booking=false; S.err=tr('taken'); render();
  }
}

  return k?tr(k)+(d?' ('+d[1]+')':''):(msg||tr('taken'));

async function doResched(){
  const scope=S.rsScope||'single';
  const wasTeacher=S.rsAsTeacher;
  const {data,error}=await sb.rpc('reschedule_booking',{p_booking:S.rs.id,p_starts:new Date(S.slot).toISOString(),p_scope:scope});
  if(error){
    const em=(error.message||'').toLowerCase(), late=em.includes('too late'), soon=em.includes('too soon');
    S.err=''; await loadBook(true); S.ty=S.types.find(x=>x.id===S.rs.session_type_id)||S.ty; await build(); S.err=tr(late?'late':soon?'tooSoon':'taken'); render(); return;
  }
  if(wasTeacher){
    S.rs=null; S.rsAsTeacher=false; S.slug=null; S.err='';
    await loadDash(); flash(tr('saved'),false); return;
  }
  const ct=await contactFor(data);
  S.done={start:S.slot,name:S.rs.student_name,type:S.ty,t:S.t,meeting:ct.meeting_url||'',whatsapp:ct.whatsapp||'',recurring:!!S.rs.series_id};
  S.rs=null; S.rsAsTeacher=false; S.err=''; await loadMine(); render();
}

async function saveHours(){
  const id=S.me.teacher.id, rows=[];
  for(let d=0;d<7;d++){
    const a=S.wk[d].filter(r=>r[0]&&r[1]).slice().sort((x,y)=>x[0]<y[0]?-1:1);
    for(let i=0;i<a.length;i++){
      if(a[i][1]<=a[i][0]||(i&&a[i][0]<a[i-1][1])){flash(tr('badHours'),true);return}
      rows.push({teacher_id:id,weekday:d,start_time:a[i][0],end_time:a[i][1]});
    }
  }
  const del=await sb.from('availability_rules').delete().eq('teacher_id',id);
  if(del.error){flash(tr('errGen'),true);return}
  if(rows.length){const ins=await sb.from('availability_rules').insert(rows); if(ins.error){await loadDash();flash(tr('errGen'),true);return}}
  await loadDash(); flash(tr('saved'));
}

function tzSel(id,sel){
  let l=[]; try{l=Intl.supportedValuesOf('timeZone')}catch(e){}
  if(!l.length) l=['Asia/Riyadh','Asia/Dubai','Africa/Cairo','Europe/London','America/New_York'];
  if(!l.includes('UTC')) l=l.concat('UTC');

  return '<select id="'+id+'">'+l.map(z=>'<option'+(z===sel?' selected':'')+'>'+esc(z)+'</option>').join('')+'</select>';
}

function renderDayCol(day, tz, fmtTime, fmt24, dayKey, minBookAt, isSingle){
  const wd=new Date(day.key+'T12:00:00Z').getUTCDay(), ex=S.dExc.filter(x=>x.on_date===day.key);
  const windows=ex.some(x=>!x.is_available)?[]:ex.length?ex.filter(x=>x.is_available).map(x=>[(x.start_time||'').slice(0,5),(x.end_time||'').slice(0,5)]):S.wk[wd]||[];
  const bookings=S.dBk.filter(b=>dayKey(new Date(b.starts_at))===day.key).sort((a,b)=>Date.parse(a.starts_at)-Date.parse(b.starts_at));
  let h='<div class="calday'+(isSingle?' single':'')+'"><h3>'+day.date.toLocaleDateString(loc(),{timeZone:tz,weekday:isSingle?'long':'short',day:'numeric',month:'short'})+'</h3>';
  if(windows.length){
    const free=[]; const types=S.dTypes.filter(x=>x.is_active).sort((a,b)=>a.duration_min-b.duration_min);
    windows.forEach(w=>{
      const [sh,sm]=w[0].split(':').map(Number),[eh,em]=w[1].split(':').map(Number), from=sh*60+sm,to=eh*60+em;
      for(let m=from;m<to;m+=30){
        const hh=String(Math.floor(m/60)).padStart(2,'0'),mm=String(m%60).padStart(2,'0'), at=toUtc(day.key,hh+':'+mm,tz);
        const open=at>=minBookAt&&types.some(ty=>m+ty.duration_min<=to&&!bookings.some(b=>at<Date.parse(b.blocked_until||b.ends_at)&&at+ty.duration_min*60000+ty.buffer_min*60000>Date.parse(b.starts_at)));
        if(open) free.push(fmt24(at));
      }
    });
    h+='<div class="calfree"><b>'+tr('available')+' ('+windows.map(w=>w[0]+'–'+w[1]).join(', ')+')</b><div class="row" style="gap:4px;margin-top:5px">'+(free.length?free.map(x=>'<span class="chip" style="padding:3px 7px;font-size:11px;cursor:default">'+x+'</span>').join(''):'<span>'+tr('noFreeSlots')+'</span>')+'</div></div>';
  } else {
    h+='<div class="calempty">'+tr('unavailable')+'</div>';
  }
  if(bookings.length){
    bookings.forEach(b=>{
      const st=b.session_types||{};
      h+='<div class="calbook"><b>'+fmtTime(b.starts_at)+' · '+esc(b.student_name)+'</b>'
        +'<small>'+(st.duration_min||'')+' '+tr('min')+' · '+esc(tn(st))+(b.series_id?' · '+tr('weeklyBadge'):'')+'</small>'
        +'<small>📞 '+esc(phoneWithFlag(b.contact_phone||''))+'</small><small>'+tr('m_by')+': '+esc(b.profiles?.full_name||b.profiles?.email||'—')+'</small>'
        +'<div class="row" style="margin-top:6px"><button type="button" class="chip" onclick="openBookingMenu(\''+b.id+'\')">'+tr('m_manage')+'</button></div></div>';
    });
  } else {
    h+='<div class="calempty">'+tr('noBookingsDay')+'</div>';
  }
  h+='</div>';
  return h;
}

function tzMin(ms,tz){const p=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(ms).reduce((a,x)=>(a[x.type]=x.value,a),{});return (+p.hour%24)*60+ +p.minute}
function tzKey(ms,tz){const p=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(ms).reduce((a,x)=>(a[x.type]=x.value,a),{});return p.year+'-'+p.month+'-'+p.day}
function ttTypeObj(){const a=S.dTypes.filter(x=>x.is_active).sort((x,y)=>x.duration_min-y.duration_min);return a.find(x=>x.id===S.ttType)||a[0]||null}
function setTtType(id){S.ttType=id;render()}
async function loadTimetable(days,tz){
  const ty=ttTypeObj(); if(!ty) return;
  const key=days[0].key+'|'+ty.id; if(S.ttKey===key||S.ttLoading===key) return;
  S.ttLoading=key;
  const from=toUtc(days[0].key,'00:00',tz), id=S.me.teacher.id;
  const [sl,cx]=await Promise.all([
    sb.rpc('get_available_slots',{p_teacher:id,p_session_type:ty.id,p_from:days[0].key,p_days:7}),
    sb.from('bookings').select('id,student_name,starts_at,ends_at').eq('teacher_id',id).eq('status','cancelled').gte('starts_at',new Date(from).toISOString()).lt('starts_at',new Date(from+7*864e5).toISOString())]);
  if(S.ttLoading!==key) return;
  S.ttLoading=null; S.ttKey=key; S.ttType=ty.id; S.ttErr=!!sl.error; S.ttSlots=sl.error?[]:(sl.data||[]); S.ttCancelled=cx.data||[];
  render();
}
function renderWeekTimetable(days,tz,dayKey,minBookAt){
  const ty=ttTypeObj();
  if(!ty) return '<div class="calempty">'+tr('m_noType')+'</div>';
  const key=days[0].key+'|'+ty.id;
  if(S.ttKey!==key){loadTimetable(days,tz); return '<div class="calempty" role="status">'+tr('m_loading')+'</div>';}
  const H=30, fmt24=ms=>new Date(ms).toLocaleTimeString('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  const windowsFor=day=>{const ex=S.dExc.filter(x=>x.on_date===day.key);return (ex.some(x=>!x.is_available)?[]:ex.length?ex.filter(x=>x.is_available).map(x=>[(x.start_time||'').slice(0,5),(x.end_time||'').slice(0,5)]):S.wk[new Date(day.key+'T12:00:00Z').getUTCDay()]||[]).map(w=>w.map(t=>{const [h,m]=t.split(':').map(Number);return h*60+m})).filter(w=>w[1]>w[0]).sort((a,b)=>a[0]-b[0])};
  const wins=days.map(windowsFor);
  const slots=(S.ttSlots||[]).map(r=>({iso:new Date(r.slot_start).toISOString(),st:r.state,a:Date.parse(r.slot_start),b:Date.parse(r.slot_end)}));
  const bks=S.dBk.map(b=>({b,a:Date.parse(b.starts_at),e:Date.parse(b.ends_at)}));
  const cxs=(S.ttCancelled||[]).map(b=>({b,a:Date.parse(b.starts_at),e:Date.parse(b.ends_at)}));
  const mins=[...wins.flat().flat(),...slots.flatMap(x=>[tzMin(x.a,tz),tzMin(x.b,tz)]),...bks.flatMap(x=>[tzMin(x.a,tz),tzMin(x.e,tz)])];
  let from=480,to=1200; if(mins.length){from=Math.floor(Math.min(...mins)/60)*60; to=Math.min(1440,Math.max(from+60,Math.ceil(Math.max(...mins)/60)*60));}
  const px=m=>(m-from)/30*H, hgt=(a,b)=>Math.max(22,(b-a)/6e4/30*H-2);
  const dayName=d=>d.date.toLocaleDateString(loc(),{timeZone:tz,weekday:'short',day:'numeric',month:'short'});
  let h='<div class="tt2-wrap"><div class="tt2" style="grid-template-columns:54px repeat(7,minmax(94px,1fr))"><div class="tt2-h tt2-t"></div>';
  days.forEach(d=>h+='<div class="tt2-h">'+dayName(d)+'</div>');
  h+='<div class="tt2-times" style="height:'+px(to)+'px">';

function teacherCalendar(){
  const tz=S.me.teacher.timezone;
  const dayKey=d=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});return p.year+'-'+p.month+'-'+p.day};
  const fmtTime=iso=>new Date(iso).toLocaleTimeString(loc(),{timeZone:tz,hour:'numeric',minute:'2-digit'});
  const fmt24=ms=>new Date(ms).toLocaleTimeString('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  const minBookAt=Date.now()+(S.me.teacher.on_the_spot_booking?0:8)*3600000;

  const modeBtns = ['day','week','agenda'].map(m=>{
    const label = m==='day'?tr('calViewDay'):m==='week'?tr('calViewWeek'):tr('calViewAgenda');
    return '<button class="chip'+(S.calMode===m?' on':'')+'" onclick="setCalMode(\''+m+'\')">'+label+'</button>';
  }).join('');

  let h='<div class="card"><div class="calnav"><h2>'+tr('calendarTitle')+'</h2><div class="row">'+modeBtns+'<button class="btn" style="width:auto" onclick="startTeacherBooking()">＋ '+tr('bookForStudent')+'</button></div></div>'+flashHtml()+'<p class="mut" style="margin-top:0">'+tr('calendarHint')+' (<b dir="ltr">'+esc(tz)+'</b>)</p>';

  if(S.calMode==='day'){
    const d=new Date(); d.setDate(d.getDate()+S.dayOffset);
    const dayObj={date:d,key:dayKey(d)};
    h+='<div class="calnav">'
      +'<div class="row"><button class="chip" onclick="S.dayOffset--;render()">‹ '+tr('prevDay')+'</button>'
      +'<button class="chip" onclick="S.dayOffset=0;render()">'+tr('todayBtn')+'</button>'
      +'<button class="chip" onclick="S.dayOffset++;render()">'+tr('nextDay')+' ›</button></div>'
      +'<b>'+d.toLocaleDateString(loc(),{timeZone:tz,weekday:'long',month:'short',day:'numeric'})+'</b>'
      +'</div>';
    h+=renderDayCol(dayObj, tz, fmtTime, fmt24, dayKey, minBookAt, true);
  } else if(S.calMode==='week'){
    const base=new Date(); base.setDate(base.getDate()+S.calendarOffset*7);
    const days=[]; for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()+i);days.push({date:d,key:dayKey(d)});}
    h+='<div class="calnav">'
      +'<div class="row"><button class="chip" onclick="S.calendarOffset--;render()">‹ '+tr('previousWeek')+'</button>'
      +'<button class="chip" onclick="S.calendarOffset=0;render()">'+tr('todayBtn')+'</button>'
      +'<button class="chip" onclick="S.calendarOffset++;render()">'+tr('nextWeek')+' ›</button></div>'
      +'<b>'+days[0].date.toLocaleDateString(loc(),{month:'short',day:'numeric'})+' – '+days[6].date.toLocaleDateString(loc(),{month:'short',day:'numeric'})+'</b>'
      +'</div>';
    h+=renderWeekTimetable(days,tz,dayKey,minBookAt);
  } else {
    if(!S.dBk.length){
      h+='<p class="mut">'+tr('noBk')+'</p>';
    } else {
      let lastKey='';
      S.dBk.forEach(b=>{
        const k=dayKey(new Date(b.starts_at)), st=b.session_types||{}, ph=(b.contact_phone||'').replace(/\D/g,'');
        if(k!==lastKey){
          lastKey=k;
          h+='<h3 style="margin:16px 0 6px;padding-top:10px;border-top:1px solid var(--line)">📅 '+fD(k)+'</h3>';
        }
        h+='<div class="bk"><div><b>'+fmtTime(b.starts_at)+' · '+esc(b.student_name)+'</b>'+(b.series_id?'<span class="badge">'+tr('weeklyBadge')+'</span>':'')
          +'<br><span class="mut">'+(st.duration_min||'')+' '+tr('min')+' · '+esc(tn(st))+'</span>'
          +(ph?' · <a target="_blank" rel="noopener" href="https://wa.me/'+ph+'">'+esc(b.contact_phone)+'</a>':'')
          +'</div><div class="row">'
          +'<button class="chip" onclick="promptResched(\''+b.id+'\',true)">'+tr('resched')+'</button>'
          +'<button class="chip danger" onclick="promptCancel(\''+b.id+'\')">'+tr('removeBooking')+'</button>'
          +'</div></div>';
      });
    }
  }
  h+='</div>';
  return h;
}

    if(m.asTeacher){
      const ms=Date.parse(b.starts_at), types=S.dTypes.filter(x=>x.is_active||x.id===b.session_type_id);
      tf='<label class="fl" for="ed_ty">'+tr('m_type')+'</label><select id="ed_ty">'+types.map(x=>'<option value="'+x.id+'"'+((v.ty||b.session_type_id)===x.id?' selected':'')+'>'+x.duration_min+' '+tr('min')+' · '+esc(tn(x))+'</option>').join('')+'</select>'
        +'<div class="g2"><div><label class="fl" for="ed_d">'+tr('m_date')+'</label><input id="ed_d" type="date" value="'+(v.d||tzKey(ms,tz))+'"></div><div><label class="fl" for="ed_h">'+tr('m_time')+'</label><input id="ed_h" type="time" step="300" value="'+(v.h||new Date(ms).toLocaleTimeString('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}))+'"></div></div><p class="mut" style="margin:0">'+esc(tz||'')+'</p>';
    }
    const sc=b.series_id?'<label class="fl">'+tr('m_scope')+'</label><label class="ck"><input type="radio" name="ed_scope" value="single"'+((v.sc||'single')==='single'?' checked':'')+'> '+tr('m_this')+'</label><label class="ck"><input type="radio" name="ed_scope" value="future"'+(v.sc==='future'?' checked':'')+'> '+tr('m_future')+'</label>':'';
    h=wrap(tr('m_edit'),(m.err?'<div class="err" role="alert">'+esc(m.err)+'</div>':'')
      +'<label class="fl" for="ed_n">'+tr('name')+'</label><input id="ed_n" maxlength="120" value="'+esc(v.n)+'">'
      +'<label class="fl" for="ed_p">'+tr('phone')+'</label><input id="ed_p" type="tel" maxlength="32" dir="ltr" value="'+esc(v.p)+'">'
      +'<label class="fl" for="ed_t">'+tr('m_notes')+'</label><textarea id="ed_t" maxlength="1000" rows="2" style="width:100%">'+esc(v.t)+'</textarea>'
      +tf+sc+'<div class="stack">'+bt('btn" id="ed_save','submitEdit()',tr('m_save'))+bt('chip','closeModal()',tr('back'))+'</div>');
  }
  if(m.type==='danger'){
    const adm=m.kind==='admin', nm=adm?((S.adminData&&S.adminData.teachers||[]).find(x=>x.id===m.target)||{}).display_name||'':'';
    h=wrap(tr(adm?'m_delTitleAdmin':'m_delTitle')+(nm?': '+nm:''),(m.err?'<div class="err" role="alert">'+esc(m.err)+'</div>':'')+'<p>'+tr(adm?'m_delBodyAdmin':'m_delBody')+'</p><label class="fl" for="dg_in">'+tr('m_delType').replace('{w}',tr('m_delWord'))+'</label><input id="dg_in" autocomplete="off" oninput="$(\'#dg_go\').disabled=this.value.trim().toLowerCase()!==tr(\'m_delWord\').toLowerCase()"><div class="stack">'+bt('btn d" id="dg_go" disabled="disabled','confirmDanger()',tr('m_delGo'))+bt('chip','closeModal()',tr('back'))+'</div>');
  }
  M.innerHTML=h;
}

// ---- main render ----
function render(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  const A=$('#app');
  $('#who').textContent=S.user?(tr('hi')+' '+(S.user.user_metadata?.full_name||S.user.email)):'';
  const th=ls.get('theme')||'system'; let b='<span class="seg" role="group" aria-label="Theme">'+[['system','🖥️','m_themeSys'],['light','☀️','m_themeLight'],['dark','🌙','m_themeDark']].map(([k,i,l])=>'<button type="button" aria-pressed="'+(th===k)+'" title="'+tr(l)+'" aria-label="'+tr(l)+'" onclick="setTheme(\''+k+'\')">'+i+'</button>').join('')+'</span> <button type="button" id="languageToggle">'+tr('lang')+'</button> ';
  if(S.user&&S.slug) b+='<button onclick="nav(null)">'+tr(S.me&&S.me.teacher?'goDash':'goHome')+'</button> ';
  b+='<button onclick="S.user?signOut():signIn()">'+tr(S.user?'out':'in')+'</button>';
  $('#btns').innerHTML=b;
  const languageToggle=$('#languageToggle'); if(languageToggle) languageToggle.addEventListener('click',()=>setLang(lang==='ar'?'en':'ar'));
  $('#footNote').textContent=tr('footNote');
  $('#footPriv').textContent=tr('footPriv');
  $('#footTerms').textContent=tr('footTerms');

  const dash=!S.slug&&S.user&&S.me&&(S.me.teacher||S.me.role==='admin')&&!S.reg;
  A.className = (dash && S.tab==='calendar' && S.calMode==='week') ? 'wide' : '';
  $('#h1').textContent = S.slug&&S.t ? tr('bookWith')+' '+S.t.display_name : dash ? tr('dashTitle') : tr('title');
  $('#sub').textContent = S.slug ? '' : dash ? (S.me.teacher?S.me.teacher.display_name:tr('tAdmin')) : tr('sub');
  if(SB_KEY.startsWith('PASTE')){A.innerHTML='<div class="card err">'+tr('cfg')+'</div>';return}
  if(!S.ready){A.innerHTML='<div class="card mut">…</div>';return}
  A.innerHTML = S.slug ? viewBook()
    : !S.user ? viewLanding()
    : !S.me ? '<div class="card mut">…</div>'
    : dash ? viewDash()
    : viewHome();
  renderModal();
}

async function init(){
  const q=new URLSearchParams(location.search), m=location.pathname.match(/^\/t\/([a-z0-9-]+)/i);
  let slug=((q.get('t')||(m&&m[1])||'')+'').toLowerCase()||null;
  const inv=q.get('invite'); if(inv) ls.set('invite',inv.toUpperCase().replace(/[^A-Z0-9]/g,''));
  const {data:{session}}=await sb.auth.getSession(); S.user=session?.user||null;
  const next=ls.get('next'); ls.del('next');
  if(!slug&&S.user&&next) slug=next;
  S.slug=slug;
  writeAppHistory('replace');
  window.addEventListener('popstate', async (event)=>{
    if(event.state?.bmc){ await restoreAppRoute(event.state); }
    else {
      // Keep browser Back inside the app instead of leaving an authenticated page
      // through a stale OAuth redirect/history entry. Never sign the user out here.
      writeAppHistory('replace');
      if(S.user&&S.me?.teacher){S.slug=null;S.teacherBooking=false;S.rs=null;S.rsAsTeacher=false;await loadDash();render();}
    }
  });
  sb.auth.onAuthStateChange((_e,s)=>{
    const u=s?.user||null;
    if((u?.id||null)!==(S.user?.id||null)) setTimeout(async()=>{
      S.user=u; S.loaded=null; S.done=null;
      if(u){await Promise.all([loadMe(),loadMine()])} else {S.me=null;S.mine=[]}
      if(S.slug&&S.t&&u) await loadBook();
      S.reg = !!(u&&S.me&&!S.me.teacher&&hasInvite()&&!S.slug);
      render();
    },0);
  });
  if(S.user) await Promise.all([loadMe(),loadMine()]);
  await loadTeacher();
  if(S.slug&&S.user&&S.t) await loadBook();
  S.reg = !!(S.user&&S.me&&!S.me.teacher&&hasInvite()&&!S.slug);
  S.ready=true; render();
}
applyTheme();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)closeModal()});
render(); init();
</script>
</body>
