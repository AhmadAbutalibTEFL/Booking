<style>
:root{--bg:#f3f5ff;--card:#fff;--ink:#1d2340;--mut:#6b7194;--pri:#5b5bf0;--acc:#2fc4b2;--line:#e1e5f6}
@media(prefers-color-scheme:dark){:root{--bg:#12142a;--card:#1c1f3d;--ink:#eef0ff;--mut:#9aa0c8;--line:#2d315a}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
.hero{background:linear-gradient(135deg,#5b5bf0,#2fc4b2);color:#fff;padding:22px 18px 54px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;max-width:640px;margin:0 auto 14px}
.bar button{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:20px;padding:7px 14px;font-size:14px;cursor:pointer}
.hero h1{max-width:640px;margin:0 auto;font-size:26px}
.hero p{max-width:640px;margin:6px auto 0;opacity:.9}
main{max-width:640px;margin:-34px auto 40px;padding:0 14px}
.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(60,60,140,.1)}
.card h2{margin:0 0 12px;font-size:16px;display:flex;gap:8px;align-items:center}
.n{background:var(--pri);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
select,input,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:var(--card);color:var(--ink);margin-bottom:10px;font-family:inherit}
input[type=checkbox]{width:auto;margin:0}
input.t{width:auto;margin:0;padding:8px}
textarea{min-height:80px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:15px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip small{display:block;opacity:.75}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:600;color:#fff;background:var(--pri);cursor:pointer}
.btn.g{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.w{background:#25d366;display:block;text-align:center;text-decoration:none;margin-top:10px}
a.btn{display:block;text-align:center;text-decoration:none;margin-top:10px}
.mut{color:var(--mut);font-size:14px}
.err{background:#ffe9e9;color:#b00020;padding:10px;border-radius:10px;margin-bottom:10px}
.okb{background:#e3f8ef;color:#0b6b47;padding:10px;border-radius:10px;margin-bottom:10px}
.ok{text-align:center}.ok .big{font-size:46px}
.bk{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.bk:first-of-type{border-top:0;padding-top:0}
.bk a{color:var(--pri);font-size:14px}
.tc{display:flex;gap:14px;align-items:center}
.tc h2{margin:0 0 4px;font-size:19px}.tc p{margin:0}
.av{flex:none;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#5b5bf0,#2fc4b2);color:#fff;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.fl{font-size:13px;color:var(--mut);margin:0 0 4px;display:block}
.day{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.day:first-of-type{border-top:0}
.day b{width:90px;flex:none;padding-top:8px}
.day .rs{display:flex;flex-direction:column;gap:8px;flex:1}
.lk{display:flex;gap:8px;align-items:stretch}.lk input{margin:0;direction:ltr}
.ck{display:flex;gap:8px;padding:6px 0;font-size:15px}
.ck a{color:var(--pri);cursor:pointer;text-decoration:underline}
.sub{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.day{flex-direction:column;gap:4px}.day b{width:auto;padding:0}.g2{grid-template-columns:1fr}}
code{background:var(--bg);padding:2px 8px;border-radius:8px;font-size:15px;direction:ltr;display:inline-block}
</style>
</head>

// ---- time zone helpers (no libraries) ----
function off(ms,tz){const o={};new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date(ms)).forEach(p=>o[p.type]=p.value);return Date.UTC(o.year,o.month-1,o.day,o.hour,o.minute,o.second)-ms}
function toUtc(d,t,tz){const[Y,M,D]=d.split('-').map(Number),[h,m]=t.split(':').map(Number),g=Date.UTC(Y,M-1,D,h,m);return g-off(g-off(g,tz),tz)}

// ---- data loading ----
async function loadMine(){
  if(!S.user){S.mine=[];return}
  const r = await sb.from('bookings')
    .select('id,student_name,starts_at,teacher_id,session_type_id,session_types(duration_min,name,name_ar),teachers(display_name,slug)')
    .eq('booker_id',S.user.id).eq('status','confirmed').gte('starts_at',new Date().toISOString()).order('starts_at');
  S.mine = r.data || [];
  await Promise.all(S.mine.map(async b=>{
    const c = await sb.rpc('get_booking_contact',{p_booking:b.id});
    b.ct = (c.data && c.data[0]) || {};
  }));
}
async function loadMe(){
  if(!S.user){S.me=null;return}
  const [p,t] = await Promise.all([
    sb.from('profiles').select('role,full_name').eq('id',S.user.id).maybeSingle(),
    sb.rpc('get_my_teacher')]);
  S.me = {role:(p.data&&p.data.role)||'student', teacher:(t.data&&t.data[0])||null};
  if(S.me.teacher) await loadDash();
}
async function loadDash(){
  const id=S.me.teacher.id, today=new Date().toISOString().slice(0,10), now=new Date().toISOString();
  const bq = cols => sb.from('bookings').select(cols).eq('teacher_id',id).eq('status','confirmed').gte('starts_at',now).order('starts_at');
  const [a,b,c,d] = await Promise.all([
    sb.from('session_types').select('*').eq('teacher_id',id).order('duration_min'),
    sb.from('availability_rules').select('*').eq('teacher_id',id).order('start_time'),
    sb.from('availability_exceptions').select('*').eq('teacher_id',id).gte('on_date',today).order('on_date'),
    bq('id,student_name,contact_phone,notes,starts_at,session_types(name,name_ar,duration_min)')]);
  S.dTypes=a.data||[]; S.dRules=b.data||[]; S.dExc=c.data||[];
  S.wk={}; for(let i=0;i<7;i++) S.wk[i]=[];
  S.dRules.forEach(r=>S.wk[r.weekday].push([r.start_time.slice(0,5),r.end_time.slice(0,5)]));
  let bk=d;
  if(bk.error) bk=await bq('id,student_name,starts_at,session_types(name,name_ar,duration_min)');
  S.dBk=bk.data||[];
}

  const r = await sb.from('teachers').select(TCOLS).eq('slug',S.slug).eq('is_active',true).maybeSingle();

}
// loads the booking data for the current teacher link (needs login)
async function loadBook(keep){
  if(!S.user||!S.t) return;
  const id=S.t.id, ty=keep&&S.ty&&S.ty.id, err=keep?S.err:'';
  S.ty=null;S.day=null;S.slot=null;S.slots={};S.done=null;S.err=err;
  const [a,b,c,r] = await Promise.all([
    sb.from('session_types').select('*').eq('teacher_id',id).eq('is_active',true).order('duration_min'),
    sb.from('availability_rules').select('*').eq('teacher_id',id),
    sb.from('availability_exceptions').select('*').eq('teacher_id',id),
    sb.rpc('get_busy_times',{p_teacher:id,p_from:new Date().toISOString(),p_to:new Date(Date.now()+15*864e5).toISOString()})]);
  S.types=a.data||[]; S.rules=b.data||[]; S.exc=c.data||[];
  S.busy=(r.data||[]).map(x=>[Date.parse(x.starts_at),Date.parse(x.blocked_until)]);
  S.ty=(ty&&S.types.find(x=>x.id===ty)) || (S.types.length===1?S.types[0]:null);
  S.loaded=id; build();
}
function build(){
  S.slots={}; S.day=null; S.slot=null; if(!S.t||!S.ty) return;
  const tz=S.t.timezone, dur=S.ty.duration_min*6e4, buf=S.ty.buffer_min*6e4, min=Date.now()+S.t.min_notice_hours*36e5;
  const td=new Date().toLocaleDateString('en-CA',{timeZone:tz}).split('-').map(Number);
  for(let i=0;i<14;i++){
    const dt=new Date(Date.UTC(td[0],td[1]-1,td[2]+i)), ds=dt.toISOString().slice(0,10), ex=S.exc.filter(x=>x.on_date===ds);
    const w = ex.some(x=>!x.is_available) ? [] : ex.length ? ex.filter(x=>x.is_available) : S.rules.filter(r=>r.weekday===dt.getUTCDay());
    w.forEach(r=>{
      const a=toUtc(ds,r.start_time.slice(0,5),tz), b=toUtc(ds,r.end_time.slice(0,5),tz);
      for(let s=a;s+dur<=b;s+=18e5){
        if(s<min||S.busy.some(([x,y])=>s<y&&s+dur+buf>x)) continue;
        const k=new Date(s).toLocaleDateString('en-CA'); const arr=(S.slots[k]=S.slots[k]||[]); if(!arr.includes(s)) arr.push(s);
      }
    });
  }
  Object.values(S.slots).forEach(a=>a.sort((x,y)=>x-y));
}

function typeFields(id,x){
  x=x||{};
  return '<div class="g2">'+fld(tr('nameEn'),'<input id="ty-n-'+id+'" value="'+esc(x.name||'')+'">')+fld(tr('nameAr'),'<input id="ty-a-'+id+'" dir="rtl" value="'+esc(x.name_ar||'')+'">')
    +fld(tr('dur'),'<input id="ty-d-'+id+'" type="number" min="5" step="5" value="'+(x.duration_min||'')+'">')+fld(tr('buf'),'<input id="ty-b-'+id+'" type="number" min="0" step="5" value="'+(x.buffer_min??5)+'">')+'</div>';
}
function tabTypes(){
  return '<div class="card"><h2>'+tr('typesTitle')+'</h2>'+flashHtml()+'<p class="mut">'+tr('typesHint')+'</p>'
    +S.dTypes.map(x=>'<div class="sub">'+typeFields(x.id,x)+'<div class="row" style="justify-content:space-between"><label class="row"><input type="checkbox" id="ty-v-'+x.id+'"'+(x.is_active?' checked':'')+'> '+tr('vis')+'</label><button class="chip" onclick="saveType(\''+x.id+'\')">'+tr('save')+'</button></div></div>').join('')+'</div>'
    +'<div class="card"><h2>'+tr('addType')+'</h2>'+typeFields('new',{buffer_min:5})+'<button class="btn" onclick="addType()">'+tr('add')+'</button></div>';
}
function tabBookings(){
  return '<div class="card"><h2>'+tr('upcoming')+'</h2>'+(S.dBk.length?S.dBk.map(b=>{
    const st=b.session_types||{}, ph=(b.contact_phone||'').replace(/\D/g,'');
    return '<div class="bk"><div><b>'+esc(b.student_name)+'</b><br><span class="mut">'+fF(Date.parse(b.starts_at))+' · '+(st.duration_min||'')+' '+tr('min')+'</span>'
      +(ph?'<br><a target="_blank" rel="noopener" href="https://wa.me/'+ph+'">'+esc(b.contact_phone)+'</a>':'')+(b.notes?'<br><span class="mut">'+esc(b.notes)+'</span>':'')+'</div></div>';
  }).join(''):'<p class="mut">'+tr('noBk')+'</p>')+'</div>';
}
function tabProfile(){
  const t=S.me.teacher;
  return '<div class="card"><h2>'+tr('tProf')+'</h2>'+flashHtml()
    +fld(tr('dname'),'<input id="pn" value="'+esc(t.display_name)+'">')
    +fld(tr('bioL'),'<textarea id="pb">'+esc(t.bio||'')+'</textarea>')
    +fld(tr('photoL'),'<input id="pp" style="direction:ltr" value="'+esc(t.photo_url||'')+'">')
    +fld(tr('meetL'),'<input id="pm" style="direction:ltr" placeholder="https://meet.google.com/…" value="'+esc(t.meeting_url||'')+'"><p class="mut" style="margin:-4px 0 10px">'+tr('meetH')+'</p>')
    +fld(tr('waL'),'<input id="pw" type="tel" style="direction:ltr" placeholder="9665XXXXXXXX" value="'+esc(t.whatsapp||'')+'">')
    +fld(tr('tzl'),tzSel('pt',t.timezone))
    +fld(tr('noticeL'),'<input id="pnh" type="number" min="0" max="168" value="'+t.min_notice_hours+'">')
    +fld(tr('slugL'),'<input id="ps" style="direction:ltr" value="'+esc(t.slug)+'"><p class="mut" style="margin:-4px 0 10px">'+tr('slugWarn')+'</p>')
    +'<button class="btn" onclick="saveProfile()">'+tr('save')+'</button></div>';
}
function viewDash(){
  const tabs=[['link','tLink'],['hours','tHours'],['types','tTypes'],['bk','tBook'],['prof','tProf']];
  if(S.me.role==='admin') tabs.push(['inv','tInv']);
  let h='<div class="card"><div class="row">'+tabs.map(([k,l])=>'<button class="chip'+(S.tab===k?' on':'')+'" onclick="setTab(\''+k+'\')">'+tr(l)+'</button>').join('')+'</div></div>';
  h+=({link:tabLink,hours:tabHours,types:tabTypes,bk:tabBookings,prof:tabProfile,inv:()=>flashHtml()+invitesCard()}[S.tab]||tabLink)();
  return h;
}

// ---- main render ----
function render(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  const A=$('#app');
  $('#who').textContent=S.user?(tr('hi')+' '+(S.user.user_metadata?.full_name||S.user.email)):'';
  let b='<button onclick="setLang(lang==\'ar\'?\'en\':\'ar\')">'+tr('lang')+'</button> ';
  if(S.user&&S.slug) b+='<button onclick="nav(null)">'+tr(S.me&&S.me.teacher?'goDash':'goHome')+'</button> ';
  b+='<button onclick="S.user?signOut():signIn()">'+tr(S.user?'out':'in')+'</button>';
  $('#btns').innerHTML=b;
  const dash=!S.slug&&S.user&&S.me&&S.me.teacher&&!S.reg;
  $('#h1').textContent = S.slug&&S.t ? tr('bookWith')+' '+S.t.display_name : dash ? tr('dashTitle') : tr('title');
  $('#sub').textContent = S.slug ? '' : dash ? S.me.teacher.display_name : tr('sub');
  if(SB_KEY.startsWith('PASTE')){A.innerHTML='<div class="card err">'+tr('cfg')+'</div>';return}
  if(!S.ready){A.innerHTML='<div class="card mut">…</div>';return}
  A.innerHTML = S.slug ? viewBook()
    : !S.user ? viewLanding()
    : !S.me ? '<div class="card mut">…</div>'
    : dash ? viewDash()
    : viewHome();
}

async function init(){
  const q=new URLSearchParams(location.search), m=location.pathname.match(/^\/t\/([a-z0-9-]+)/i);
  let slug=((q.get('t')||(m&&m[1])||'')+'').toLowerCase()||null;
  const inv=q.get('invite'); if(inv) ls.set('invite',inv.toUpperCase().replace(/[^A-Z0-9]/g,''));
  const {data:{session}}=await sb.auth.getSession(); S.user=session?.user||null;
  const next=ls.get('next'); ls.del('next');
  if(!slug&&S.user&&next) slug=next;          // returning from Google login: go back to the teacher's page
  S.slug=slug;
  if(slug||inv){try{history.replaceState(null,'',slug?'?t='+encodeURIComponent(slug):location.pathname)}catch(e){}}
  sb.auth.onAuthStateChange((_e,s)=>{
    const u=s?.user||null;
    // only react to real login/logout, not silent token refreshes (they would wipe the form)
    if((u?.id||null)!==(S.user?.id||null)) setTimeout(async()=>{
      S.user=u; S.loaded=null; S.done=null;
      if(u){await Promise.all([loadMe(),loadMine()])} else {S.me=null;S.mine=[]}
      if(S.slug&&S.t&&u) await loadBook();
      S.reg = !!(u&&S.me&&!S.me.teacher&&hasInvite()&&!S.slug);
      render();
    },0);
  });
  if(S.user) await Promise.all([loadMe(),loadMine()]);
  await loadTeacher();
  if(S.slug&&S.user&&S.t) await loadBook();
  S.reg = !!(S.user&&S.me&&!S.me.teacher&&hasInvite()&&!S.slug);
  S.ready=true; render();
}
render(); init();
</script>
</body>
